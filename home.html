<!-- ===== menu.html ===== -->
<!DOCTYPE html>
<html>
<head>
    <style>
        :root {
            --menu-bg: #111827;
            --menu-bg-soft: #1f2937;
            --menu-text: #e5e7eb;
            --menu-text-muted: #cbd5e1;
            --menu-accent: #c9a66b;
            --menu-accent-strong: #b38a4b;
            --menu-line: rgba(255, 255, 255, 0.08);
        }

        body {
            background: linear-gradient(180deg, var(--menu-bg) 0%, var(--menu-bg-soft) 100%);
            margin: 0;
            padding: 20px 10px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        h3 {
            color: var(--menu-accent);
            font-size: 15px;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-align: center;
            margin-bottom: 25px;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--menu-accent);
        }

        a {
            display: block;
            color: var(--menu-text-muted);
            text-decoration: none;
            padding: 14px 12px;
            font-size: 15px;
            font-weight: 500;
            border-bottom: 1px solid var(--menu-line);
            transition: all 0.3s ease;
            text-align: center;
            border-radius: 8px;
            margin: 4px 0;
        }

        a:hover {
            background: linear-gradient(135deg, var(--menu-accent) 0%, var(--menu-accent-strong) 100%);
            color: #ffffff;
            padding-left: 18px;
            border-bottom-color: var(--menu-accent);
            transform: translateX(4px);
        }

        a:last-child {
            border-bottom: none;
        }
    </style>
</head>
<body>
    <h3>Main Menu</h3>
    <a href="home.html" target="rightside"> Home</a>
    <a href="resume.html" target="rightside"> Resume</a>
    <a href="projects.html" target="rightside"> Projects</a>
    <a href="contact.html" target="rightside"> Contact</a>
    <a href="about.html" target="rightside"> About</a>
</body>
</html>
